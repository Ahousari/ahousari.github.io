<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Italian Garden · Menu Studio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <a class="brand" href="#" aria-label="Italian Garden Menu Studio"><span class="brand-mark">❧</span><span>Italian Garden<small>MENU STUDIO</small></span></a>
    <div class="project-heading"><span class="eyebrow">YOUR WORKSPACE</span><span id="project-title">Restaurant menu</span><span id="save-status" role="status">Ready</span></div>
    <div class="header-actions"><button id="undo" title="Undo (Ctrl+Z)">↶ <span>Undo</span></button><button id="redo" title="Redo (Ctrl+Shift+Z)">↷</button><span class="separator"></span><button id="open-project">Open</button><button id="save-project">Save project</button><button id="print" class="primary">Print / Save PDF <span>↗</span></button></div>
  </header>
  <div class="studio">
    <aside class="outline" aria-label="Menu sections">
      <div class="outline-heading"><span class="eyebrow">THE MENU</span><button id="add-section" class="icon-button" title="Add section" aria-label="Add section">＋</button></div>
      <input id="search" type="search" placeholder="Find a section or dish…" aria-label="Find a section or dish">
      <div class="outline-subhead"><span>SECTIONS</span><span id="section-count"></span></div>
      <nav id="section-list" aria-label="Select section"></nav>
      <div class="outline-bottom"><span class="source-dot"></span><div>Original menu content<small>Keep every dish until approved otherwise.</small></div></div>
    </aside>
    <main class="workspace">
      <div class="canvas-toolbar"><div><span class="live-dot"></span> PRINT PREVIEW <span id="paper-label"></span></div><div class="view-controls"><button id="zoom-out" aria-label="Zoom out">−</button><span id="zoom-label">50%</span><button id="zoom-in" aria-label="Zoom in">＋</button><button id="fit">Fit width</button><button id="fit-page">Fit page</button></div></div>
      <div id="summary-bar" class="summary-bar"></div>
      <div id="canvas-scroll"><div id="pages"></div><section id="overflow-panel" hidden></section></div>
      <footer class="workspace-footer"><span>Live layout · physical page dimensions</span><span id="layout-status" role="status"></span></footer>
    </main>
    <aside class="inspector" aria-label="Editor controls">
      <div class="inspector-tabs" role="tablist" aria-label="Editor panels"><button role="tab" aria-selected="true" data-tab="content">Content</button><button role="tab" aria-selected="false" data-tab="style">Style</button><button role="tab" aria-selected="false" data-tab="layout">Layout</button><button role="tab" aria-selected="false" data-tab="review">Review <span id="review-badge"></span></button></div>
      <div id="inspector-body"></div>
    </aside>
  </div>
  <div id="toast" role="status" hidden></div>
  <dialog id="modal"><form method="dialog"><div id="modal-content"></div><div class="dialog-actions"><button value="cancel">Cancel</button><button id="modal-confirm" value="confirm" class="primary">Continue</button></div></form></dialog>
  <input id="file-input" type="file" accept=".json,application/json" hidden>
  <input id="image-input" type="file" accept="image/png,image/jpeg,image/webp" hidden>
  <style id="print-size"></style>
  <script src="seed.js"></script>
  <script src="model.js"></script>
  <script src="app.js"></script>
</body>
</html>
