<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6e8c9"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="../assets/pip.webp"><title>Lantern Vale · The First Light</title><link rel="stylesheet" href="style.css">
</head>
<body><main id="app">
<canvas id="game" tabindex="0" aria-label="Lantern Vale game world"></canvas>
<div id="loading"><span class="sun">✦</span><h1>Lantern Vale</h1><p>Lighting the lanterns…</p></div>
<div id="hud" hidden><div class="hud-left"><button id="pause" class="icon" aria-label="Pause game">Ⅱ</button><div><small id="modeLabel"></small><strong id="objective"></strong></div></div><div class="hud-right"><span id="stats"></span><button id="sound" class="icon" aria-label="Toggle sound">♫</button><button id="fullscreen" class="icon" aria-label="Full screen">⛶</button></div></div>
<section id="overlay" aria-live="polite"></section>
<div id="toast" role="status"></div>
<div id="touch" hidden></div>
<div id="help" hidden></div>
<div id="rotate">Turn your phone sideways for more room.<button id="rotateDismiss">Play anyway</button></div>
<input type="file" id="importFile" accept="application/json" hidden>
</main><script src="game.js"></script><script src="battles.js"></script></body></html>
